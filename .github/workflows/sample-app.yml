name: Apple sample application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected Xcode
        run: test "$(xcodebuild -version | tail -n 1)" = 'Build version 17F113'
      - name: Build pinned XcodeGen
        shell: bash
        run: |
          git clone --depth 1 --branch 2.45.4 https://github.com/yonaskolb/XcodeGen.git "$RUNNER_TEMP/nova-xcodegen"
          swift build --package-path "$RUNNER_TEMP/nova-xcodegen" -c release --product xcodegen
          swift build --package-path "$RUNNER_TEMP/nova-xcodegen" -c release --show-bin-path >> "$GITHUB_PATH"
      - name: Verify sample model and acceptance contracts
        run: make sample-app-test
      - name: Build and launch macOS and iOS simulator apps
        run: python3 tools/sample_app.py --output build/sample-app-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-app-acceptance
          path: build/sample-app-acceptance
